<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>别扣了支持</title>
    <meta name="description" content="别扣了 iOS App 支持与联系方式">
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #007aff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 16px 42px rgba(17, 24, 39, 0.06);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      h2 {
        margin: 32px 0 10px;
        font-size: 20px;
        line-height: 1.35;
        letter-spacing: 0;
      }

      p {
        margin: 10px 0;
      }

      .meta {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 14px;
      }

      .contact {
        padding: 14px 16px;
        border: 1px solid rgba(0, 122, 255, 0.22);
        border-radius: 10px;
        background: rgba(0, 122, 255, 0.08);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 24px, 760px);
          padding: 24px 0 40px;
        }

        article {
          border-radius: 14px;
          padding: 22px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>别扣了支持</h1>
        <p class="meta">开发者：Maverick ｜ 适用产品：别扣了 iOS App</p>

        <h2>联系我们</h2>
        <p>如果你在使用别扣了时遇到问题，或希望反馈建议，可以通过邮件联系我们。</p>
        <p class="contact">支持邮箱：<a href="mailto:1239916371@qq.com">1239916371@qq.com</a></p>

        <h2>隐私政策</h2>
        <p>你也可以查看 <a href="../privacy/">别扣了隐私政策</a>。</p>
      </article>
    </main>
  </body>
</html>
